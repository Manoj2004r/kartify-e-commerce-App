apiVersion: v1
kind: ConfigMap
metadata:
  name: kartify-backend-config
  namespace: kartify
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_URI: "mongodb://kartify-mongo:27017/kartify"
  JWT_EXPIRES_IN: "7d"
  CLIENT_URL: "http://kartify.local"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "300"
