# Requires the metrics-server addon to be running in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kartify-backend-hpa
  namespace: kartify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kartify-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kartify-frontend-hpa
  namespace: kartify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kartify-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
