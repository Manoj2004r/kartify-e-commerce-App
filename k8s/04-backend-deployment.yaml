apiVersion: apps/v1
kind: Deployment
metadata:
  name: kartify-backend
  namespace: kartify
  labels:
    app: kartify-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kartify-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kartify-backend
    spec:
      containers:
        - name: kartify-backend
          # Replace with your pushed image, e.g. ghcr.io/<you>/kartify-backend:1.0.0
          image: kartify-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: kartify-backend-config
            - secretRef:
                name: kartify-backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health/live
              port: 5000
            failureThreshold: 30
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kartify-backend
  namespace: kartify
spec:
  selector:
    app: kartify-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
